[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jump-experiment-runner"
version = "0.1.0"
description = "Safe experiment automation and mechanistic analysis primitives for JUMP"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
modal = ["modal>=1.1,<2"]
track-h = ["numpy>=1.26,<3", "safetensors>=0.4,<1", "torch>=2.2,<3"]
test = [
  "modal>=1.1,<2",
  "numpy>=1.26,<3",
  "pytest>=8,<9",
  "safetensors>=0.4,<1",
  "torch>=2.2,<3",
]

[project.scripts]
jump-experiments = "jump_runner.cli:main"
jump-mechanistic = "jump_mechanistic.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jump_runner = ["schemas/*.json"]
jump_mechanistic = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
